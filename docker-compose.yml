
services:
  inventory-db:
    image: postgres:17
    container_name: shopsphere-inventory-db
    environment:
      POSTGRES_DB: shopsphere_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopsphere_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build: .
    container_name: shopsphere-inventory-service
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/shopsphere_inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      inventory-db:
        condition: service_healthy

volumes:
  inventory-data:
